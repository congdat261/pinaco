<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Technical Data Sheet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- Thư viện đăng nhập Microsoft: ưu tiên bản đặt cùng thư mục, nếu thiếu thì lấy từ CDN -->

<style>
:root{--blue:#1f4e9c;--accent:#4472c4;--ink:#1d2330;--muted:#6b7385;--line:#c9d2e3;--bg:#eef1f6;--panel:#fff}
*{box-sizing:border-box}
.page,.page *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.toolbar{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar h1{font-size:16px;margin:0 12px 0 0;color:var(--blue);white-space:nowrap}
.combo{position:relative;flex:1 1 360px;max-width:560px}
.combo input{width:100%;padding:9px 38px 9px 12px;font-size:15px;border:1px solid var(--line);border-radius:6px;outline:none}
.combo input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4472c433}
.combo .chev{position:absolute;right:4px;top:4px;bottom:4px;width:32px;border:0;background:none;cursor:pointer;font-size:14px;color:var(--muted)}
.list{position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:360px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px #0002;display:none;margin:0;padding:4px 0;list-style:none}
.list.open{display:block}
.list li{padding:7px 12px;cursor:pointer;line-height:1.25}
.list li .m{font-weight:600}
.list li .t{font-size:12px;color:var(--muted)}
.list li mark{background:#ffe58a;color:inherit;padding:0}
.list li.active,.list li:hover{background:#e7eefb}
.list .empty{color:var(--muted);cursor:default}
select,.btn{padding:9px 12px;font-size:14px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.info{font-size:12px;color:var(--muted)}
.info.ok{color:#1a7f37}.info.warn{color:#b35900}
.imgbox .miss{color:#b35900}
#file{display:none}
.stage{padding:24px 12px;display:flex;flex-direction:column;align-items:center;gap:24px}
.placeholder{margin-top:80px;color:var(--muted);text-align:center}
/* ===== A4 page — theo file Word mẫu (lề T23 P17.4 D10 T15 mm, Calibri 13pt) ===== */
.page{--b:#4472c4;width:210mm;height:297mm;background:#fff;padding:5mm 17.4mm 10mm 15mm;box-shadow:0 2px 12px #0002;
  font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:13pt;line-height:1.15;color:#000;display:flex;flex-direction:column;overflow:hidden}
.hdr{width:185mm;margin-left:-2.5mm;display:grid;grid-template-columns:22.5mm 1fr;align-items:start;flex:none}
.hdr .logo{padding:1.8mm 0}
.hdr .logo img{width:19mm;height:22.75mm;display:block}
.hdr .co{padding:6pt 1.9mm 6pt;text-align:justify}
.hdr .co .n{font-size:16pt;font-weight:bold;color:var(--b);line-height:1.1}
.hdr .co .r{display:grid;grid-template-columns:92mm 1fr}
.hdr .co a{color:var(--b);text-decoration:underline}
.rule{width:185mm;margin-left:-2.5mm;flex:none;height:7px;border-top:4px solid var(--b);border-bottom:2px solid var(--b);margin-bottom:5mm}
.ttl{text-align:center;font-weight:bold;font-size:25pt;color:var(--b);line-height:1.1;flex:none}
.mdl{text-align:right;font-weight:bold;font-size:15pt;color:var(--b);margin:6pt 0;flex:none}
table.spec{width:185mm;margin-left:-2.5mm;border-collapse:collapse;table-layout:fixed;flex:none}
table.spec td{padding:2pt 1.9mm;vertical-align:bottom;border-bottom:.5pt solid #000;height:5mm}
table.spec td.v,table.spec td.s{padding-left:calc(1.9mm + .7mm)}
table.spec td.gap{border:none}
table.spec tr:not(.sec):not(.img) td:first-child{white-space:nowrap;overflow:visible}
.sym{font-family:"Times New Roman",serif}
table.spec tr.sec td{border-bottom:3pt solid var(--b);height:7mm;padding-top:3pt;padding-bottom:3pt}
table.spec tr.sec td.h{background:var(--b);color:#fff;font-weight:bold;padding-left:calc(1.9mm + 3mm)}
table.spec tr.img td{border:none;height:110mm;padding:6pt 0 0;vertical-align:top;text-align:center}
.imgbox{display:flex;align-items:flex-start;justify-content:center;width:100%;height:100%;font-size:10pt;color:#999;font-style:italic}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain}
tr.img .imgbox{height:100%}
.drawfill{flex:1 1 auto;min-height:0;width:185mm;margin-left:-2.5mm;padding-top:6pt;display:flex}
.drawfill .imgbox{flex:1;height:auto}
body.pdfexport .imgbox .ph,body.pdfexport .imgbox .miss{visibility:hidden}
.stage.pdfmode{padding:0;gap:0;align-items:flex-start}
.stage.pdfmode .page{box-shadow:none}

/* ===== Tìm kiếm nâng cao ===== */
.adv{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;display:none}
.adv.open{display:block}
.adv form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;align-items:end;max-width:1180px}
.adv label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.adv label b{color:var(--ink);font-size:13px;font-weight:600}
.adv input,.adv select{padding:8px 10px;font-size:14px;border:1px solid var(--line);border-radius:6px;width:100%;font-variant-numeric:tabular-nums}
.adv input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #4472c433}
.adv .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.adv .opts label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
.adv .opts input{width:auto}
.adv .opts input[type=number]{width:70px;padding:5px 8px}
.adv .opts label{white-space:nowrap}
.adv .acts{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.res{margin-top:12px;max-width:1180px;overflow-x:auto}
.res .sum{font-size:13px;color:var(--muted);margin:0 0 6px}
.res .sum.warn{color:#b35900}
.res table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:760px}
.res th{text-align:left;background:#e7eefb;color:var(--blue);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
.res th.n,.res td.n{text-align:right}
.res td{padding:6px 8px;border-bottom:1px solid #e4e8f0;white-space:nowrap}
.res td .t{color:var(--muted);font-size:12px;white-space:normal}
.res tbody tr{cursor:pointer}
.res tbody tr:hover{background:#f2f6fd}
.res tbody tr.sel{background:#dce7fb}
.res .ok{color:#1a7f37}.res .off{color:#b35900}
.res .scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.btn.on{background:#e7eefb;border-color:var(--accent);color:var(--blue)}
@media (max-width:860px){.stage{overflow-x:auto;align-items:flex-start}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);max-width:min(560px,92vw);background:#1d2330;color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px #0004;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .toolbar,.placeholder,#toast,.adv{display:none!important}
  .stage{padding:0;gap:0}
  .page{box-shadow:none;page-break-after:always}
  .imgbox .ph,.imgbox .miss{visibility:hidden}
  .page:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<div class="toolbar">
  <h1>TECHNICAL DATA SHEET</h1>
  <div class="combo" id="combo">
    <input id="q" type="text" placeholder="Gõ hoặc chọn model / chủng loại / SKU… (vd: 95D31, N150, DIN60)" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="lst">
    <button class="chev" id="chev" title="Xem toàn bộ danh sách" aria-label="Mở danh sách">▼</button>
    <ul class="list" id="lst" role="listbox"></ul>
  </div>
  <button class="btn" id="advbtn" aria-expanded="false" aria-controls="adv">🔎 Tìm theo thông số</button>
  <select id="lang" title="Ngôn ngữ">
    <option value="both">EN + VI (2 trang)</option>
    <option value="en">English</option>
    <option value="vi">Tiếng Việt</option>
  </select>
  <button class="btn primary" id="pdf" disabled>⬇ Xuất PDF</button>
  <button class="btn" id="prn" disabled>🖨 In</button>
  <button class="btn" id="refresh" title="Đọc lại dữ liệu từ file Excel nguồn">🔄 Làm mới</button>
  <button class="btn" id="signin" hidden>🔑 Đăng nhập Microsoft 365</button>
  <button class="btn" id="load" title="Chọn file Excel trên máy">📂 Nạp Excel</button>
  <input type="file" id="file" accept=".xlsx,.xlsm,.xls">
  <span class="info" id="info"></span>
</div>
<div class="adv" id="adv">
  <form id="advform" autocomplete="off">
    <label><b>Chiều dài (mm)</b><input type="number" name="Length" min="0" step="any" placeholder="vd: 304"></label>
    <label><b>Chiều rộng (mm)</b><input type="number" name="Width" min="0" step="any" placeholder="vd: 173"></label>
    <label><b>Tổng cao (mm)</b><input type="number" name="Total Height" min="0" step="any" placeholder="vd: 224"></label>
    <label><b>Dung lượng (Ah) tối thiểu</b><input type="number" name="Capacity" min="0" step="any" placeholder="vd: 70"></label>
    <label><b>CCA (A) tối thiểu</b><input type="number" name="CCA" min="0" step="any" placeholder="vd: 600"></label>
    <label><b>Nhóm (Group)</b><select name="group"><option value="">Tất cả</option></select></label>
    <label><b>Bố trí cực tính</b><select name="layout"><option value="">Tất cả</option></select></label>
    <div class="opts">
      <span>Kích thước:</span>
      <label><input type="radio" name="dimmode" value="fit" checked> Vừa khoang chứa (≤ kích thước nhập)</label>
      <label><input type="radio" name="dimmode" value="near"> Gần đúng ± <input type="number" name="tol" value="3" min="0" step="1"> mm</label>
      <label><input type="checkbox" name="caphi" > Dung lượng & CCA không vượt quá <input type="number" name="hipct" value="10" min="0" step="5"> %</label>
    </div>
    <div class="acts">
      <button type="submit" class="btn primary">Tìm chủng loại phù hợp</button>
      <button type="reset" class="btn">Xoá điều kiện</button>
      <span class="info">Bỏ trống ô nào thì không lọc theo ô đó.</span>
    </div>
  </form>
  <div class="res" id="advres"></div>
</div>
<div class="stage" id="stage"><div class="placeholder">Chọn một sản phẩm ở ô phía trên để xem thông số kỹ thuật.</div></div>

let DATA = EMBEDDED, DATA_SOURCE = "dữ liệu nhúng sẵn";

/* ============ TIỆN ÍCH ============ */
const $ = s => document.querySelector(s);
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[\s\-_/().,]+/g,"");
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const v = x => (x===""||x==null) ? "–" : x;
function num(x, dec, vi){ if(x===""||x==null) return "–"; const n=parseFloat(String(x).replace(",", ".")); if(isNaN(n)) return x;
  const s=n.toFixed(dec); return vi ? s.replace(".", ",") : s; }
function status(msg, cls){ const el=$("#info"); el.textContent=msg; el.className="info "+(cls||""); }
const stamp = () => new Date().toLocaleString("vi-VN");

/* Lấy giá trị một cột theo tên (không phân biệt hoa thường / khoảng trắng) */
function field(d, name){
  if(name in d) return d[name];
  const k=Object.keys(d).find(k=>norm(k)===norm(name)); return k ? d[k] : "";
}
/* Ghép URL ảnh từ mẫu + dữ liệu. Nếu thiếu giá trị cột nào thì trả về null. */
function imageUrl(tpl, d, fallbackCol){
  if(tpl){
    let missing=false;
    const url = tpl.replace(/\{([^}]+)\}/g,(_,name)=>{ const val=String(field(d,name.trim())??"").trim();
      if(!val||val.startsWith("#")) missing=true; return encodeURIComponent(val); });
    return missing ? null : url;
  }
  const raw=String(field(d,fallbackCol)??"").trim();
  return /^(https?:|data:)/i.test(raw) ? raw : null;
}

/* ============ MICROSOFT GRAPH (tuỳ chọn) ============ */
let pca=null, account=null;
const SCOPES=["Files.Read.All"];
let graphError="";
async function graphInit(){
  if(!CONFIG.graph.clientId) return false;
  if(!window.msal){ graphError="không tải được thư viện đăng nhập Microsoft (msal-browser.min.js)"; return false; }
  pca = new msal.PublicClientApplication({ auth:{ clientId:CONFIG.graph.clientId,
      authority:"https://login.microsoftonline.com/"+CONFIG.graph.tenantId, redirectUri:location.origin+location.pathname },
    cache:{ cacheLocation:"localStorage" } });
  await pca.initialize();
  const r = await pca.handleRedirectPromise();
  account = r?.account || pca.getAllAccounts()[0] || null;
  $("#signin").hidden = !!account;
  return true;
}
async function graphToken(){
  if(!account) throw new Error("Chưa đăng nhập Microsoft 365");
  try{ return (await pca.acquireTokenSilent({scopes:SCOPES, account})).accessToken; }
  catch{ return (await pca.acquireTokenPopup({scopes:SCOPES, account})).accessToken; }
}
const shareId = url => "u!" + btoa(unescape(encodeURIComponent(url))).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
async function graphDownload(url){
  const tok = await graphToken(), H={headers:{Authorization:"Bearer "+tok}};
  let clean=url; try{ clean=encodeURI(decodeURI(url)); }catch{}
  let r = await fetch(`https://graph.microsoft.com/v1.0/shares/${shareId(clean)}/driveItem/content`, H);
  if(!r.ok){
    // Dự phòng: file nằm trong OneDrive của chính người đăng nhập (…/personal/<user>/Documents/<đường dẫn>)
    const m = decodeURI(url.split("?")[0]).match(/\/personal\/[^/]+\/Documents\/(.+)$/i);
    if(m){ const p=m[1].split("/").map(encodeURIComponent).join("/");
      const r2 = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${p}:/content`, H);
      if(r2.ok) return r2; }
    throw new Error(r.status===403||r.status===404 ? "tài khoản này không có quyền xem file Excel nguồn (Graph "+r.status+")" : "Graph "+r.status);
  }
  return r;
}
const isSharePoint = url => /\.sharepoint\.com|onedrive\.live\.com|1drv\.ms/i.test(url);

/* ============ ĐỌC EXCEL ============ */
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const name = wb.SheetNames.find(n=>norm(n)===norm(CONFIG.sheetName)) || wb.SheetNames.find(n=>norm(n).includes("datasheet"));
  if(!name) throw new Error(`Không thấy sheet "${CONFIG.sheetName}". Các sheet có: ${wb.SheetNames.join(", ")}`);
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:"",raw:true});
  const data = rows.map(r=>{ const o={}; for(const k in r){ let x=r[k]; if(typeof x==="string"){x=x.trim(); if(x.startsWith("#")) x="";} o[String(k).trim()]=x; } return o; })
                   .filter(r=>String(r.Model||"").trim());
  if(!data.length) throw new Error(`Sheet "${name}" không có dòng nào có cột Model`);
  return data;
}
async function loadFromSource(){
  const src = new URLSearchParams(location.search).get("src") || CONFIG.excelUrl;
  if(!src){ useCache(); return; }
  status("Đang đọc file Excel nguồn…");
  try{
    let res;
    if(isSharePoint(src)){
      if(!pca){ useCache(); status(`Chưa kết nối được Microsoft 365${graphError?": "+graphError:""} · đang dùng ${DATA_SOURCE}`, "warn"); return; }
      if(!account){ useCache(); status(`Bấm “🔑 Đăng nhập Microsoft 365” để tải dữ liệu mới nhất · đang dùng ${DATA_SOURCE}`, "warn"); return; }
      res = await graphDownload(src);
    } else {
      res = await fetch(src + (src.includes("?")?"&":"?") + "_t=" + Date.now(), {credentials:"include"});
      if(!res.ok) throw new Error("HTTP "+res.status);
    }
    setData(parseWorkbook(new Uint8Array(await res.arrayBuffer())), "Excel nguồn · cập nhật " + stamp(), true);
    status(`${DATA.length} dòng · ${DATA_SOURCE}`, "ok");
  }catch(e){
    console.error(e); useCache();
    status(`Không đọc được Excel nguồn (${e.message}) · đang dùng ${DATA_SOURCE}`, "warn");
  }
}
function setData(data, source, cache){
  DATA=data; DATA_SOURCE=source; buildIndex();
  if(cache){ try{ localStorage.setItem("ds_cache", JSON.stringify({t:stamp(), data})); }catch{} }
  if(current){ const same=DATA.find(d=>d.Model===current.Model && d.Type===current.Type); same ? render(same) : clearView(); }
}
function useCache(){
  try{ const c=JSON.parse(localStorage.getItem("ds_cache")||"null");
    if(c?.data?.length){ setData(c.data, "bản lưu lúc " + c.t, false); return; } }catch{}
  setData(EMBEDDED, "dữ liệu nhúng sẵn", false);
  status(`${DATA.length} dòng · ${DATA_SOURCE}`);
}

/* ============ CHỈ MỤC TÌM KIẾM ============ */
let INDEX = [];
function buildIndex(){
  INDEX = DATA.map((d,i)=>({i, label:String(d.Model), sub:[d.Type, d.SKU].filter(Boolean).join(" · "),
     key: norm([d.Model,d.Type,d.SKU,field(d,"DIN code L"),field(d,"DIN code R")].join(" "))}))
     .sort((a,b)=>a.label.localeCompare(b.label, undefined, {numeric:true}));
  status(`${DATA.length} dòng · ${DATA_SOURCE}`);
  if(typeof fillAdvSelects==="function" && document.getElementById("advform")) fillAdvSelects();
  if(typeof advRows!=="undefined" && advRows.length) runAdvanced();
}
function search(q){
  const toks = String(q).trim().split(/\s+/).map(norm).filter(Boolean);
  if(!toks.length) return INDEX;
  const res = INDEX.filter(e=>toks.every(t=>e.key.includes(t)));
  const nm = norm(toks.join(""));
  return res.sort((a,b)=>(norm(b.label).startsWith(nm)) - (norm(a.label).startsWith(nm)));
}
function hl(text, q){
  const t=String(q).trim(); if(!t) return esc(text);
  const i=text.toLowerCase().indexOf(t.toLowerCase());
  return i<0 ? esc(text) : esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+t.length))+"</mark>"+esc(text.slice(i+t.length));
}

/* ============ COMBOBOX ============ */
const q=$("#q"), lst=$("#lst"); let items=[], act=-1, current=null;
function openList(all){
  items = all ? INDEX : search(q.value);
  const show = items.slice(0,300);
  lst.innerHTML = show.length ? show.map((e,k)=>`<li role="option" data-k="${k}"><div class="m">${hl(e.label, all?"":q.value)}</div><div class="t">${esc(e.sub)}</div></li>`).join("")
    + (items.length>300?`<li class="empty">… còn ${items.length-300} kết quả, gõ thêm để lọc</li>`:"")
    : `<li class="empty">Không tìm thấy “${esc(q.value)}”</li>`;
  act=-1; lst.classList.add("open"); q.setAttribute("aria-expanded","true");
}
function closeList(){ lst.classList.remove("open"); q.setAttribute("aria-expanded","false"); }
function pick(k){ const e=items[k]; if(!e) return; q.value=e.label; closeList(); render(DATA[e.i]); }
q.addEventListener("input",()=>openList(false));
q.addEventListener("focus",()=>openList(!q.value));
q.addEventListener("keydown",ev=>{
  const lis=[...lst.querySelectorAll("li[data-k]")];
  if(ev.key==="ArrowDown"){ev.preventDefault(); if(!lst.classList.contains("open")) openList(false); act=Math.min(act+1,lis.length-1);}
  else if(ev.key==="ArrowUp"){ev.preventDefault(); act=Math.max(act-1,0);}
  else if(ev.key==="Enter"){ev.preventDefault(); pick(act>=0?act:0); return;}
  else if(ev.key==="Escape"){closeList(); return;} else return;
  lis.forEach((li,i)=>li.classList.toggle("active",i===act)); lis[act]?.scrollIntoView({block:"nearest"});
});
lst.addEventListener("mousedown",ev=>{const li=ev.target.closest("li[data-k]"); if(li){ev.preventDefault(); pick(+li.dataset.k);}});
$("#chev").addEventListener("click",()=>{ lst.classList.contains("open")?closeList():(q.focus(),openList(true)); });
document.addEventListener("click",ev=>{ if(!$("#combo").contains(ev.target)) closeList(); });

function capacityRule(d){

  const k=Object.keys(m).find(k=>k!=="default" && k.trim().toUpperCase()===g);
  return m[k] || m.default;
}

      ${dim(L.dim,L.len,u(F("Length"),"mm"))}${dim("",L.wid,u(F("Width"),"mm"))}${dim("",L.hei,u(F("Height"),"mm"))}${dim("",L.th,u(F("Total Height"),"mm"))}
      ${row(L.nw, nw===""?"–":`${L.ap} ${num(nw,2,vi)} kg`)}
      ${row(L.gw, gw===""?"–":`${L.ap} ${num(gw,2,vi)} kg`)}
      ${row(L.term, esc(v(F("Terminal"))))}
      ${row(L.lay, esc(v(F("Cell Layout"))))}

    </table>`;
  const drawing = `<table class="spec">${COLS}${sec(L.dr)}</table><div class="drawfill">${box(drawingUrl)}</div>`;
  const top = `${header(vi)}<div class="ttl">${L.t}</div><div class="mdl">${L.m} ${esc(d.Model)}</div>`;

  // Nhóm có Self-discharge: Drawing sang trang riêng (như file Word). Nhóm khác: gọn trong 1 trang.
  return withSD
    ? `<section class="page">${top}${specTable}</section><section class="page">${header(vi)}${drawing}</section>`
    : `<section class="page">${top}${specTable}${drawing}</section>`;
}

/* Tải ảnh: ảnh trên SharePoint/OneDrive đi qua Graph (để PDF nhúng được ảnh), ảnh khác tải trực tiếp */
const imgCache = new Map();
function fetchImage(url){
  if(imgCache.has(url)) return imgCache.get(url);
  const p = (async()=>{
    if(pca && account && isSharePoint(url)) return URL.createObjectURL(await (await graphDownload(url)).blob());
    try{ const r=await fetch(url,{mode:"cors"}); if(r.ok) return URL.createObjectURL(await r.blob()); }catch{}
    return url;   // máy chủ không cho CORS: vẫn hiển thị & in được, nhưng PDF tải về có thể thiếu ảnh
  })();
  imgCache.set(url,p); return p;
}
function loadImages(){
  return Promise.all([...document.querySelectorAll(".imgbox[data-src]")].map(async box=>{
    try{
      const src = await fetchImage(box.dataset.src);
      await new Promise((ok,fail)=>{ const im=new Image(); im.onload=()=>{box.innerHTML=""; box.appendChild(im); ok();}; im.onerror=fail; im.src=src; });
    }catch{ box.innerHTML=`<span class="miss" title="${esc(box.dataset.src)}">${esc(box.dataset.miss)}</span>`; }
  }));
}
let imagesReady = Promise.resolve();
function render(d){
  current=d; const lg=$("#lang").value;
  $("#stage").innerHTML = (lg!=="vi"?pages(d,false):"") + (lg!=="en"?pages(d,true):"");
  $("#pdf").disabled=$("#prn").disabled=false;
  imagesReady = loadImages();
}
function clearView(){ current=null; q.value=""; $("#stage").innerHTML='<div class="placeholder">Chọn một sản phẩm ở ô phía trên để xem thông số kỹ thuật.</div>'; $("#pdf").disabled=$("#prn").disabled=true; }
$("#lang").addEventListener("change",()=>current&&render(current));

/* ============ XUẤT PDF / IN ============ */
const pdfName = () => "DATASHEET_" + String(current.Model).replace(/[^\w\-]+/g,"_");
function toast(msg, ms=7000){
  let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms);
}
/* In bằng trình duyệt → "Lưu dưới dạng PDF". Luôn giữ được hình (kể cả hình trên SharePoint/máy chủ khác).
   Tên file gợi ý lấy theo tiêu đề trang. */
async function printAsPdf(){
  await imagesReady;
  const old=document.title; document.title=pdfName();
  const restore=()=>{ document.title=old; removeEventListener("afterprint",restore); };
  addEventListener("afterprint",restore); window.print(); setTimeout(restore, 1000);
}
/* Đổi mọi hình về dạng dữ liệu nội bộ (data URL) để thư viện PDF chụp được.
   Trả về false nếu có hình mà máy chủ không cho phép (không có CORS). */
async function makeImagesCapturable(){
  let ok=true;
  for(const im of document.querySelectorAll("#stage .imgbox img")){
    if(/^(data:|blob:)/.test(im.src)) continue;
    try{
      const url = await new Promise((res,rej)=>{ const x=new Image(); x.crossOrigin="anonymous";
        x.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=x.naturalWidth; c.height=x.naturalHeight;
          c.getContext("2d").drawImage(x,0,0); res(c.toDataURL("image/png")); }catch(e){ rej(e); } };
        x.onerror=rej; x.src=im.src; });
      im.src=url;
    }catch{ ok=false; }
  }
  return ok;
}
$("#prn").addEventListener("click", printAsPdf);
$("#pdf").addEventListener("click",async()=>{
  if(!current) return;
  const btn=$("#pdf"); btn.disabled=true; btn.textContent="Đang tạo PDF…";
  try{
    await imagesReady;
    const capturable = window.html2pdf && await makeImagesCapturable();
    if(!capturable){
      // Hình nằm ở máy chủ không cho phép chụp → dùng bộ in của trình duyệt để PDF vẫn có hình
      toast("Hộp thoại In sẽ mở: chọn máy in “Save as PDF / Lưu dưới dạng PDF” rồi bấm Lưu. (Cách này giữ đầy đủ hình ảnh.)");
      await printAsPdf();
    } else {
      const stage=$("#stage"), pages=[...stage.querySelectorAll(".page")];
      const h2c={scale:2,useCORS:true,scrollX:0,scrollY:0};
      stage.classList.add("pdfmode"); document.body.classList.add("pdfexport");
      try{
        // chụp từng trang thành ảnh rồi đặt vừa khổ A4 → không lệch, không có trang trắng
        const doc = await html2pdf().set({jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, margin:0}).from("<div></div>").toPdf().get("pdf");
        for(let i=0;i<pages.length;i++){
          const cv = await html2pdf().set({html2canvas:h2c}).from(pages[i]).toCanvas().get("canvas");
          let w=210, h=w*cv.height/cv.width; if(h>297){ h=297; w=h*cv.width/cv.height; }
          if(i) doc.addPage(); else doc.setPage(1);
          doc.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",(210-w)/2,0,w,h);
        }
        doc.save(pdfName()+".pdf");
      } finally { stage.classList.remove("pdfmode"); document.body.classList.remove("pdfexport"); }
    }
  }catch(e){ console.error(e); toast("Không tạo được PDF trực tiếp — chọn “Save as PDF” trong hộp thoại In."); await printAsPdf(); }
  btn.disabled=false; btn.textContent="⬇ Xuất PDF";
});


/* ============ TÌM KIẾM NÂNG CAO (theo thông số) ============ */
const ADV_FIELDS = [
  {k:"Length",       label:"Dài",      kind:"dim"},
  {k:"Width",        label:"Rộng",     kind:"dim"},
  {k:"Total Height", label:"Tổng cao", kind:"dim"},
  {k:"Capacity",     label:"Ah",       kind:"min"},
  {k:"CCA",          label:"CCA",      kind:"min"}
];
const toNum = x => { if(x===""||x==null) return NaN; const n=parseFloat(String(x).replace(",", ".")); return n; };
const advForm=$("#advform"), advRes=$("#advres");
$("#advbtn").addEventListener("click",()=>{
  const open=$("#adv").classList.toggle("open");
  $("#advbtn").classList.toggle("on",open); $("#advbtn").setAttribute("aria-expanded",open);
  if(open) advForm.querySelector("input").focus();
});
function fillAdvSelects(){
  const put=(name,col)=>{ const sel=advForm.elements[name], cur=sel.value;
    const vals=[...new Set(DATA.map(d=>String(field(d,col)??"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    sel.innerHTML='<option value="">Tất cả</option>'+vals.map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join(""); };
  put("group","Group"); put("layout","Cell Layout");
}
/* Đánh giá 1 sản phẩm theo điều kiện: trả về {pass, score, flags} */
function evaluate(d, c){
  let pass=true, score=0; const flags={};
  for(const f of ADV_FIELDS){
    const want=c[f.k]; if(isNaN(want)) continue;
    const got=toNum(field(d,f.k));
    if(isNaN(got)){ pass=false; flags[f.k]=false; score+=10; continue; }
    let ok, dev;
    if(f.kind==="dim"){
      if(c.dimmode==="fit"){ ok = got<=want; dev = ok ? (want-got)/want : (got-want)/want*5; }
      else { dev=Math.abs(got-want); ok = dev<=c.tol; dev = dev/want*(ok?1:5); }
    } else {
      const hi = c.caphi ? want*(1+c.hipct/100) : Infinity;
      ok = got>=want && got<=hi; dev = got>=want ? (got-want)/want*0.5 : (want-got)/want*5;
      if(got>hi) dev += (got-hi)/want*2;
    }
    flags[f.k]=ok; if(!ok) pass=false; score+=dev;
  }
  if(c.group && String(field(d,"Group")).trim()!==c.group) pass=false;
  if(c.layout && String(field(d,"Cell Layout")).trim()!==c.layout) pass=false;
  return {pass, score, flags};
}
function readCriteria(){
  const E=advForm.elements, c={};
  for(const f of ADV_FIELDS) c[f.k]=toNum(E[f.k].value);
  c.dimmode=E.dimmode.value; c.tol=Math.max(0,toNum(E.tol.value)||0);
  c.caphi=E.caphi.checked; c.hipct=Math.max(0,toNum(E.hipct.value)||0);
  c.group=E.group.value; c.layout=E.layout.value;
  return c;
}
let advRows=[];
function runAdvanced(){
  const c=readCriteria();
  const any = ADV_FIELDS.some(f=>!isNaN(c[f.k])) || c.group || c.layout;
  if(!any){ advRes.innerHTML='<p class="sum warn">Nhập ít nhất một thông số (kích thước, dung lượng hoặc CCA) hoặc chọn nhóm.</p>'; return; }
  const all = DATA.map(d=>({d, ...evaluate(d,c)}));
  let rows = all.filter(r=>r.pass).sort((a,b)=>a.score-b.score), exact=true;
  if(!rows.length){
    exact=false;
    rows = all.filter(r=>(!c.group||String(field(r.d,"Group")).trim()===c.group) && (!c.layout||String(field(r.d,"Cell Layout")).trim()===c.layout))
              .sort((a,b)=>a.score-b.score).slice(0,15);
  }
  advRows=rows.slice(0,200);
  const cell=(r,k,unit)=>{ const val=field(r.d,k); if(val===""||val==null) return `<td class="n">–</td>`;
    const cls = r.flags[k]===true ? "ok" : r.flags[k]===false ? "off" : ""; return `<td class="n ${cls}">${esc(val)}${unit?" "+unit:""}</td>`; };
  const n=rows.length;
  advRes.innerHTML = `<p class="sum ${exact?"":"warn"}">${exact
      ? `Tìm thấy <b>${n}</b> chủng loại phù hợp${n>200?" (hiển thị 200 kết quả sát nhất)":""}, sắp xếp từ sát nhất. Bấm vào một dòng để xem data sheet.`
      : `Không có chủng loại đáp ứng đủ mọi điều kiện. Dưới đây là ${n} chủng loại gần nhất — ô màu cam là thông số chưa đạt.`}</p>
    <div class="scroll"><table><thead><tr>
      <th>Model / Chủng loại</th><th>Nhóm</th><th class="n">Dài</th><th class="n">Rộng</th><th class="n">Tổng cao</th>
      <th class="n">Dung lượng</th><th class="n">CCA</th><th class="n">Bố trí</th><th>Cọc</th><th>Chân đế</th></tr></thead><tbody>
      ${advRows.map((r,i)=>`<tr data-i="${i}"${current===r.d?' class="sel"':""}>
        <td><b>${esc(r.d.Model)}</b><div class="t">${esc(r.d.Type)}</div></td><td>${esc(v(field(r.d,"Group")))}</td>
        ${cell(r,"Length","")}${cell(r,"Width","")}${cell(r,"Total Height","")}${cell(r,"Capacity",capacityRule(r.d).unit)}${cell(r,"CCA","A")}
        <td class="n">${esc(v(field(r.d,"Cell Layout")))}</td><td>${esc(v(field(r.d,"Terminal")))}</td><td>${esc(v(field(r.d,"Hold down")))}</td></tr>`).join("")}
    </tbody></table></div>`;
}
advForm.addEventListener("submit",ev=>{ ev.preventDefault(); runAdvanced(); });
advForm.addEventListener("reset",()=>setTimeout(()=>{ advRes.innerHTML=""; advRows=[]; },0));
advRes.addEventListener("click",ev=>{
  const tr=ev.target.closest("tr[data-i]"); if(!tr) return;
  const r=advRows[+tr.dataset.i]; q.value=r.d.Model; render(r.d);
  advRes.querySelectorAll("tr.sel").forEach(x=>x.classList.remove("sel")); tr.classList.add("sel");
  $("#stage").scrollIntoView({behavior:"smooth", block:"start"});
});

/* ============ NÚT ĐIỀU KHIỂN ============ */
$("#refresh").addEventListener("click",()=>{ imgCache.clear(); loadFromSource(); });
$("#signin").addEventListener("click",async()=>{
  try{ const r=await pca.loginPopup({scopes:SCOPES}); account=r.account; $("#signin").hidden=true; loadFromSource(); }
  catch(e){ status("Đăng nhập không thành công: "+(e.errorCode==="popup_window_error"?"trình duyệt đã chặn cửa sổ đăng nhập, hãy cho phép pop-up cho trang này":e.message),"warn"); }
});
$("#load").addEventListener("click",()=>$("#file").click());
$("#file").addEventListener("change",async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ setData(parseWorkbook(new Uint8Array(await f.arrayBuffer())), f.name + " · nạp lúc " + stamp(), true); status(`${DATA.length} dòng · ${DATA_SOURCE}`,"ok"); }
  catch(e){ alert("Không đọc được file: "+e.message); }
  ev.target.value="";
});

/* ============ KHỞI ĐỘNG: tự đọc Excel mỗi lần mở trang ============ */
(async()=>{
  buildIndex();
  try{ await graphInit(); }catch(e){ console.error(e); graphError=e.message; }
  await loadFromSource();
})();
</script>
