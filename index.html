<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PINACO Technical Data Sheet</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<!-- Thư viện đăng nhập Microsoft: ưu tiên bản đặt cùng thư mục, nếu thiếu thì lấy từ CDN -->
<script src="msal-browser.min.js"></script>
<script>window.msal||document.write('<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"><\/script>')</script>
<script>window.msal||document.write('<script src="https://unpkg.com/@azure/msal-browser@3.28.1/lib/msal-browser.min.js"><\/script>')</script>
<style>
:root{--blue:#1f4e9c;--accent:#4472c4;--ink:#1d2330;--muted:#6b7385;--line:#c9d2e3;--bg:#eef1f6;--panel:#fff}
*{box-sizing:border-box}
.page,.page *{-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
.toolbar{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar h1{font-size:16px;margin:0 12px 0 0;color:var(--blue);white-space:nowrap}
.combo{position:relative;flex:1 1 360px;max-width:560px}
.combo input{width:100%;padding:9px 38px 9px 12px;font-size:15px;border:1px solid var(--line);border-radius:6px;outline:none}
.combo input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4472c433}
.combo .chev{position:absolute;right:4px;top:4px;bottom:4px;width:32px;border:0;background:none;cursor:pointer;font-size:14px;color:var(--muted)}
.list{position:absolute;left:0;right:0;top:calc(100% + 4px);max-height:360px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px #0002;display:none;margin:0;padding:4px 0;list-style:none}
.list.open{display:block}
.list li{padding:7px 12px;cursor:pointer;line-height:1.25}
.list li .m{font-weight:600}
.list li .t{font-size:12px;color:var(--muted)}
.list li mark{background:#ffe58a;color:inherit;padding:0}
.list li.active,.list li:hover{background:#e7eefb}
.list .empty{color:var(--muted);cursor:default}
select,.btn{padding:9px 12px;font-size:14px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.info{font-size:12px;color:var(--muted)}
.info.ok{color:#1a7f37}.info.warn{color:#b35900}
.imgbox .miss{color:#b35900}
.imgbox .diag{display:block;margin-top:6px;font-size:9pt;font-style:normal;color:#8a5a00;max-width:160mm;word-break:break-all;line-height:1.35}
#file{display:none}
.stage{padding:24px 12px;display:flex;flex-direction:column;align-items:center;gap:24px}
.placeholder{margin-top:80px;color:var(--muted);text-align:center}
/* ===== A4 page — theo file Word mẫu (lề T23 P17.4 D10 T15 mm, Calibri 13pt) ===== */
.page{--b:#4472c4;width:210mm;height:297mm;background:#fff;padding:5mm 17.4mm 10mm 15mm;box-shadow:0 2px 12px #0002;
  font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:13pt;line-height:1.15;color:#000;display:flex;flex-direction:column;overflow:hidden}
.hdr{width:185mm;margin-left:-2.5mm;display:grid;grid-template-columns:22.5mm 1fr;align-items:start;flex:none}
.hdr .logo{padding:1.8mm 0}
.hdr .logo img{width:19mm;height:22.75mm;display:block}
.hdr .co{padding:6pt 1.9mm 6pt;text-align:justify}
.hdr .co .n{font-size:16pt;font-weight:bold;color:var(--b);line-height:1.1}
.hdr .co .r{display:grid;grid-template-columns:92mm 1fr}
.hdr .co a{color:var(--b);text-decoration:underline;cursor:pointer}
.rule{width:185mm;margin-left:-2.5mm;flex:none;height:7px;border-top:4px solid var(--b);border-bottom:2px solid var(--b);margin-bottom:5mm}
.ttl{text-align:center;font-weight:bold;font-size:25pt;color:var(--b);line-height:1.1;flex:none}
.mdl{text-align:right;font-weight:bold;font-size:15pt;color:var(--b);margin:6pt 0;flex:none}
table.spec{width:185mm;margin-left:-2.5mm;border-collapse:collapse;table-layout:fixed;flex:none}
table.spec td{padding:2pt 1.9mm;vertical-align:bottom;border-bottom:.5pt solid #000;height:5mm}
table.spec td.v,table.spec td.s{padding-left:calc(1.9mm + .7mm)}
table.spec td.gap{border:none}
table.spec tr:not(.sec):not(.img) td:first-child{white-space:nowrap;overflow:visible}
.sym{font-family:"Times New Roman",serif}
table.spec tr.sec td{border-bottom:3pt solid var(--b);height:7mm;padding-top:3pt;padding-bottom:3pt}
table.spec tr.sec td.h{background:var(--b);color:#fff;font-weight:bold;padding-left:calc(1.9mm + 3mm)}
table.spec tr.img td{border:none;height:110mm;padding:6pt 0 0;vertical-align:top;text-align:center}
.imgbox{display:flex;align-items:flex-start;justify-content:center;width:100%;height:100%;font-size:10pt;color:#999;font-style:italic}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain}
tr.img .imgbox{height:100%}
.drawfill{flex:1 1 auto;min-height:0;width:185mm;margin-left:-2.5mm;padding-top:6pt;display:flex}
.drawfill .imgbox{flex:1;height:auto}
body.pdfexport .imgbox .ph,body.pdfexport .imgbox .miss{visibility:hidden}
.stage.pdfmode{padding:0;gap:0;align-items:flex-start}
.stage.pdfmode .page{box-shadow:none}

/* ===== Tìm kiếm nâng cao ===== */
.adv{background:var(--panel);border-bottom:1px solid var(--line);padding:14px 16px;display:none}
.adv.open{display:block}
.adv form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;align-items:end;max-width:1280px}
.adv select{text-overflow:clip}
.adv form > label > input,.adv form > label > select{height:36px}
/* Màn hình rộng: tất cả điều kiện nằm trên 1 hàng; ô kích thước thu nhỏ, ô Nhóm rộng nhất */
@media (min-width:1000px){
  .adv form{grid-template-columns:repeat(3,minmax(84px,108px)) repeat(2,minmax(130px,165px)) minmax(230px,1fr) minmax(110px,140px)}
}
@media (max-width:999px){ .adv label.wide{grid-column:span 2} }
@media (max-width:520px){ .adv label.wide{grid-column:1/-1} }
.res .bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px}
.res .bar .sum{margin:0}

.adv label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.adv label b{color:var(--ink);font-size:13px;font-weight:600}
.adv input,.adv select{padding:8px 10px;font-size:14px;border:1px solid var(--line);border-radius:6px;width:100%;font-variant-numeric:tabular-nums}
.adv input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px #4472c433}
.adv .opts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:13px}
.adv .opts label{flex-direction:row;align-items:center;gap:6px;color:var(--ink);font-size:13px}
.adv .opts input{width:auto}
.adv .opts input[type=number]{width:70px;padding:5px 8px}
.adv .opts label{white-space:nowrap}
.adv .acts{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.res{margin-top:12px;max-width:1280px;overflow-x:auto}
.res .sum{font-size:13px;color:var(--muted);margin:0 0 6px}
.res .sum.warn{color:#b35900}
.res table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;min-width:760px}
.res th{text-align:left;background:#e7eefb;color:var(--blue);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
.res th.n,.res td.n{text-align:right}
.res th.sort{cursor:pointer;user-select:none}
.res th.sort:hover{background:#d6e2f8}
.res th.sort.on{background:#cfdcf6}
.res td{padding:6px 8px;border-bottom:1px solid #e4e8f0;white-space:nowrap}
.res td .t{color:var(--muted);font-size:12px;white-space:normal}
/* Canh giữa toàn bộ phần tìm kiếm nâng cao */
.adv form,.adv .res{margin-left:auto;margin-right:auto}
.adv form > label{text-align:center;align-items:stretch}
.adv form > label > input,.adv form > label > select{text-align:center;text-align-last:center}
.adv .opts,.adv .acts{justify-content:center;text-align:center}
.res .bar{justify-content:center}
.res .bar .sum{text-align:center}
.res .scroll{width:fit-content;max-width:100%;margin:0 auto}
/* Canh lề bảng kết quả: tiêu đề canh giữa; dữ liệu canh giữa, riêng cột Model canh trái */
.res th,.res th.n{text-align:center}
.res td,.res td.n{text-align:center}
.res td:first-child{text-align:left}
.res tbody tr{cursor:pointer}
.res tbody tr:hover{background:#f2f6fd}
.res tbody tr.sel{background:#dce7fb}
.res .ok{color:#1a7f37}.res .off{color:#b35900}
.res .scroll{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.btn.on{background:#e7eefb;border-color:var(--accent);color:var(--blue)}
/* ===== Phóng to / thu nhỏ trang data sheet ===== */
.stage .page{zoom:var(--z,1)}
.stage.pdfmode .page{zoom:1}
.zoombar{position:fixed;right:16px;bottom:16px;z-index:20;display:none;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:0 4px 16px #0002}
.zoombar.show{display:flex}
.zoombar button{border:0;background:none;min-width:36px;height:36px;border-radius:999px;font-size:18px;line-height:1;color:var(--ink);cursor:pointer;padding:0 8px}
.zoombar button:hover{background:#e7eefb}
.zoombar button:disabled{opacity:.35;cursor:default;background:none}
.zoombar #zval{font-size:13px;min-width:58px;font-variant-numeric:tabular-nums;color:var(--blue);font-weight:600}
.zoombar #zfit{font-size:13px}
.zoombar #zfit.on{background:#e7eefb;color:var(--blue)}
.zoombar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
@media (max-width:860px){.stage{overflow-x:auto;align-items:flex-start}.stage:has(.page){align-items:center}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);max-width:min(560px,92vw);background:#1d2330;color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px #0004;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%)}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .toolbar,.placeholder,#toast,.adv,.zoombar{display:none!important}
  .stage .page{zoom:1!important}
  .stage{padding:0;gap:0}
  .page{box-shadow:none;page-break-after:always}
  .imgbox .ph,.imgbox .miss{visibility:hidden}
  .page:last-child{page-break-after:auto}
}
</style>
</head>
<body>
<div class="toolbar">
  <h1>PINACO TECHNICAL DATA SHEET</h1>
  <div class="combo" id="combo">
    <input id="q" type="text" placeholder="Gõ hoặc chọn model / chủng loại / SKU… (vd: 95D31, N150, DIN60)" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="lst">
    <button class="chev" id="chev" title="Xem toàn bộ danh sách" aria-label="Mở danh sách">▼</button>
    <ul class="list" id="lst" role="listbox"></ul>
  </div>
  <button class="btn" id="advbtn" aria-expanded="false" aria-controls="adv">🔎 Tìm theo thông số</button>
  <select id="lang" title="Ngôn ngữ">
    <option value="both">EN + VI (2 trang)</option>
    <option value="en">English</option>
    <option value="vi">Tiếng Việt</option>
  </select>
  <button class="btn primary" id="pdf" disabled>⬇ Xuất PDF</button>
  <button class="btn" id="prn" disabled>🖨 In</button>
  <button class="btn" id="refresh" title="Đọc lại dữ liệu từ file Excel nguồn">🔄 Làm mới</button>
  <button class="btn" id="signin" hidden>🔑 Đăng nhập Microsoft 365</button>
  <button class="btn" id="load" title="Chọn file Excel trên máy" hidden>📂 Nạp Excel</button>
  <input type="file" id="file" accept=".xlsx,.xlsm,.xls">
  <span class="info" id="info"></span>
</div>
<div class="adv" id="adv">
  <form id="advform" autocomplete="off">
    <label class="sm"><b>Dài (mm)</b><input type="number" name="Length" min="0" step="any" placeholder="vd: 304"></label>
    <label class="sm"><b>Rộng (mm)</b><input type="number" name="Width" min="0" step="any" placeholder="vd: 173"></label>
    <label class="sm"><b>Tổng cao (mm)</b><input type="number" name="Total Height" min="0" step="any" placeholder="vd: 224"></label>
    <label><b>Dung lượng (Ah) tối thiểu</b><input type="number" name="Capacity" min="0" step="any" placeholder="vd: 70"></label>
    <label><b>CCA (A) tối thiểu</b><input type="number" name="CCA" min="0" step="any" placeholder="vd: 600"></label>
    <label class="wide"><b>Nhóm (Group)</b><select name="group"><option value="">Tất cả</option></select></label>
    <label><b>Bố trí cực tính</b><select name="layout"><option value="">Tất cả</option></select></label>
    <div class="opts">
      <span>Kích thước:</span>
      <label><input type="radio" name="dimmode" value="fit" checked> Vừa khoang chứa (≤ kích thước nhập)</label>
      <label><input type="radio" name="dimmode" value="near"> Gần đúng ± <input type="number" name="tol" value="3" min="0" step="1"> mm</label>
      <label><input type="checkbox" name="caphi" > Dung lượng & CCA không vượt quá <input type="number" name="hipct" value="10" min="0" step="5"> %</label>
    </div>
    <div class="acts">
      <button type="submit" class="btn primary">Tìm chủng loại phù hợp</button>
      <button type="reset" class="btn">Xoá điều kiện</button>
      <span class="info">Bỏ trống ô nào thì không lọc theo ô đó. Để trống tất cả rồi bấm tìm sẽ hiển thị toàn bộ danh sách.</span>
    </div>
  </form>
  <div class="res" id="advres"></div>
</div>
<div class="zoombar" id="zoombar" role="toolbar" aria-label="Phóng to, thu nhỏ">
  <button id="zout" title="Thu nhỏ (Ctrl + lăn chuột xuống)" aria-label="Thu nhỏ">−</button>
  <button id="zval" title="Về 100%">100%</button>
  <button id="zin" title="Phóng to (Ctrl + lăn chuột lên)" aria-label="Phóng to">+</button>
  <span class="sep"></span>
  <button id="zfit" title="Vừa chiều rộng màn hình">↔ Vừa khung</button>
</div>
<div class="stage" id="stage"><div class="placeholder">Chọn một sản phẩm ở ô phía trên để xem thông số kỹ thuật.</div></div>

<script>
/* =====================================================================
   CẤU HÌNH — chỉ cần sửa phần này
   ===================================================================== */
const CONFIG = {
  // 1) File Excel nguồn: dán link chia sẻ hoặc đường dẫn file trên SharePoint / OneDrive.
  //    Ví dụ: "https://pinaco.sharepoint.com/:x:/s/KyThuat/EaBcD...?e=xyz"
  //    hoặc   "https://pinaco.sharepoint.com/sites/KyThuat/Shared Documents/Battery Specification.xlsx"
  excelUrl: "https://pinacovn-my.sharepoint.com/personal/datbc_pinaco_com/Documents/Data/DATA SHEET/Battery Specification.xlsx",

  // 2) Tên sheet chứa dữ liệu (không phân biệt hoa thường, dấu cách: "DATA SHEET" = "DataSheet").
  sheetName: "DATA SHEET",

  // 3) Đăng nhập Microsoft 365 để đọc file qua Microsoft Graph (cần IT tạo App registration).
  //    Để trống clientId nếu file Excel nằm cùng máy chủ với trang hoặc cho truy cập công khai.
  graph: {
    clientId: "5b06674d-c1d0-4080-85af-ff9987aeb38e",                 // Application (client) ID
    tenantId: "b3a43c6a-6842-450d-80f1-07d557585fc6"     // Directory (tenant) ID hoặc "organizations"
  },

  // 4) Mẫu đường dẫn hình ảnh. {TênCột} sẽ được thay bằng giá trị cột đó của sản phẩm đang chọn.
  //    Có thể dùng bất kỳ cột nào: {Model}, {SKU}, {Group}, {Container Type}, {Drawing}, {Self Discharge}...
  //    Để trống "" nếu cột tương ứng trong Excel đã chứa sẵn URL đầy đủ.
  images: {
    // Mẫu đường dẫn: {TênCột} được thay bằng giá trị cột của sản phẩm đang chọn.
    selfDischarge: "https://pinacovn-my.sharepoint.com/personal/datbc_pinaco_com/Documents/Data/DATA SHEET/{Group}_SD.jpg",

    // Bản vẽ: chuyển từ công thức Excel ở cột Drawing.
    //   Thư mục chứa file Excel \ Group \ Container Type + hậu tố + ".JPG"
    //   Hậu tố: S (cọc STUD) · L/R (bố trí cực) · S (cọc T2 của N40/NS40/NS60/B2x) · H (vỏ CMF B20/B24 chân đế B1)
    drawing: (d) => {
      const up = x => String(x ?? "").trim().toUpperCase();
      const group = String(d["Group"] ?? "").trim(), ct = String(d["Container Type"] ?? "").trim();
      if(!group || !ct) return null;                                    // thiếu Group hoặc Container Type → không có hình
      const g = up(group), term = up(d["Terminal"]), lay = String(d["Cell Layout"] ?? "").trim(), sku = up(d["SKU"]);
      let s = "";
      if(term === "STUD") s += "S";
      if(g.includes("MF") || g.includes("EFB") || g.includes("AGM") ){
        if(lay === "0" || lay === "3")      s += /DIN/i.test(String(d["Type"] ?? "")) ? "" : "L";
        else if(lay === "1" || lay === "4") s += g === " MF" ? "" : "R";
      }
      if(term === "T2" && (ct.includes("MF B2") || ct.includes("CMF B2"))) s += "S";
      if((up(ct) === "CMF B20" || up(ct) === "CMF B24") && up(d["Hold down"]) === "B1") s += "H";
      return `${excelFolder()}/DRAWING/${ct}${s}.JPG`;
    }
  },

  // 5) Các Group (cột "Group") có in phần Đặc tính tự phóng. Group khác: bỏ phần này và trang được gộp còn 1 trang.
  selfDischargeGroups: ["ẮC QUY MF Ô TÔ", "ẮC QUY MF TẢI", "ẮC QUY CMF Ô TÔ", "ẮC QUY CMF TẢI", "ẮC QUY SMF", "ẮC QUY EFB"],

  // 6) Nhãn & đơn vị dòng "Dung lượng danh định" theo Group (không phân biệt hoa thường).
  //    Group không có trong danh sách dùng mặc định (dòng "default").
  capacityByGroup: {
    "ẮC QUY VRLA GẮN MÁY": { vi:"Dung lượng danh định (10 giờ)", en:"Nominal Capacity (10Hr)", unit:"Ah"  },
    "ẮC QUY SODIUM GẮN MÁY": { vi:"Công suất danh định",           en:"Nominal Power",           unit:"kWh" },
    default:  { vi:"Dung lượng danh định (20 giờ)", en:"Nominal Capacity (20Hr)", unit:"Ah"  }
  },

  operatingTemp: "25 ± 3℃ (77 ± 5℉)"
};

const $ = s => document.querySelector(s);
const norm = s => String(s ?? "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[\s\-_/().,]+/g,"");
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const v = x => (x===""||x==null) ? "–" : x;
/* Số theo ngôn ngữ, giữ nguyên số chữ số thập phân gốc: vi → dấu phẩy (7,2), en → dấu chấm (7.2) */
function dec(x, vi){
  if(x===""||x==null) return "";
  const t=String(x).trim(), n=parseFloat(t.replace(",", "."));
  if(isNaN(n) || !/^[-+]?\d+([.,]\d+)?$/.test(t)) return t;        // không phải số đơn thuần → giữ nguyên
  const s=String(+n.toFixed(6));                                       // bỏ sai số dấu phẩy động (3.5000000001)
  return vi ? s.replace(".", ",") : s;
}
function num(x, dec, vi){ if(x===""||x==null) return "–"; const n=parseFloat(String(x).replace(",", ".")); if(isNaN(n)) return x;
  const s=n.toFixed(dec); return vi ? s.replace(".", ",") : s; }
function status(msg, cls){ const el=$("#info"); el.textContent=msg; el.className="info "+(cls||""); }
const stamp = () => new Date().toLocaleString("vi-VN");

/* Lấy giá trị một cột theo tên (không phân biệt hoa thường / khoảng trắng) */
function field(d, name){
  if(name in d) return d[name];
  const k=Object.keys(d).find(k=>norm(k)===norm(name)); return k ? d[k] : "";
}
/* Ghép URL ảnh từ mẫu + dữ liệu. Nếu thiếu giá trị cột nào thì trả về null. */
function imageUrl(tpl, d, fallbackCol){ return imageInfo(tpl, d, fallbackCol).url; }
/* {url, why}: why = lý do không có URL (để hiển thị chẩn đoán trên màn hình) */
/* Thư mục chứa file Excel nguồn (giống CELL("filename") trong Excel) */
function excelFolder(){
  const src = new URLSearchParams(location.search).get("src") || CONFIG.excelUrl || "";
  return src.split("?")[0].replace(/\/:[a-z]:\/r\//i,"/").replace(/\/[^/]*$/,"");
}
function imageInfo(tpl, d, fallbackCol){
  if(typeof tpl === "function"){
    let url=null; try{ url=tpl(d); }catch(e){ return {url:null, why:"Lỗi trong công thức đường dẫn hình: "+e.message}; }
    return url ? {url:String(url), why:""} : {url:null, why:"Thiếu dữ liệu để tạo tên file hình (Group / Container Type)"};
  }
  if(tpl){
    const miss=[];
    const url = tpl.replace(/\{([^}]+)\}/g,(_,name)=>{ const val=String(field(d,name.trim())??"").trim();
      if(!val||val.startsWith("#")) miss.push(name.trim()); return encodeURIComponent(val); });
    return miss.length ? {url:null, why:`Cột ${miss.map(m=>"“"+m+"”").join(", ")} đang trống`} : {url, why:""};
  }
  const raw=String(field(d,fallbackCol)??"").trim();
  if(/^(https?:|data:)/i.test(raw)) return {url:raw, why:""};
  return {url:null, why: raw
    ? `Cột “${fallbackCol}” = “${raw}” không phải đường dẫn https://. Hãy khai báo mẫu đường dẫn trong CONFIG.images.`
    : `Cột “${fallbackCol}” trống và CONFIG.images chưa khai báo mẫu đường dẫn`};
}

/* ============ MICROSOFT GRAPH (tuỳ chọn) ============ */
let pca=null, account=null;
const SCOPES=["Files.Read.All"];
let graphError="";
async function graphInit(){
  if(!CONFIG.graph.clientId) return false;
  if(!window.msal){ graphError="không tải được thư viện đăng nhập Microsoft (msal-browser.min.js)"; return false; }
  pca = new msal.PublicClientApplication({ auth:{ clientId:CONFIG.graph.clientId,
      authority:"https://login.microsoftonline.com/"+CONFIG.graph.tenantId, redirectUri:location.origin+location.pathname },
    cache:{ cacheLocation:"localStorage" } });
  await pca.initialize();
  const r = await pca.handleRedirectPromise();
  account = r?.account || pca.getAllAccounts()[0] || null;
  $("#signin").hidden = !!account;
  return true;
}
async function graphToken(){
  if(!account) throw new Error("Chưa đăng nhập Microsoft 365");
  try{ return (await pca.acquireTokenSilent({scopes:SCOPES, account})).accessToken; }
  catch{ return (await pca.acquireTokenPopup({scopes:SCOPES, account})).accessToken; }
}
const shareId = url => "u!" + btoa(unescape(encodeURIComponent(url))).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
async function graphDownload(url){
  const tok = await graphToken(), H={headers:{Authorization:"Bearer "+tok}};
  // Bỏ tiền tố link chia sẻ kiểu "/:f:/r/", "/:x:/r/", "/:i:/r/" nếu người dùng dán vào đường dẫn trực tiếp
  url = url.replace(/\/:[a-z]:\/r\//i, "/");
  let clean=url; try{ clean=encodeURI(decodeURI(url)); }catch{}
  let r = await fetch(`https://graph.microsoft.com/v1.0/shares/${shareId(clean)}/driveItem/content`, H);
  if(!r.ok){
    // Dự phòng: file nằm trong OneDrive của chính người đăng nhập (…/personal/<user>/Documents/<đường dẫn>)
    const m = decodeURI(url.split("?")[0]).match(/\/personal\/[^/]+\/Documents\/(.+)$/i);
    if(m){ const p=m[1].split("/").map(encodeURIComponent).join("/");
      const r2 = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${p}:/content`, H);
      if(r2.ok) return r2; }
    throw new Error(r.status===403||r.status===404 ? "tài khoản này không có quyền xem file Excel nguồn (Graph "+r.status+")" : "Graph "+r.status);
  }
  return r;
}
const isSharePoint = url => /\.sharepoint\.com|onedrive\.live\.com|1drv\.ms/i.test(url);

/* ============ ĐỌC EXCEL ============ */
/* Dòng "rác": mọi ô đều trống hoặc bằng 0 (thường do công thức Excel kéo dư xuống).
   Bỏ qua cột kỹ thuật như No., __PowerAppsId__ khi xét. Dòng có Model trống hoặc = 0 cũng bị loại. */
function isBlankOrZero(x){
  if(x===""||x==null) return true;
  if(typeof x==="number") return x===0;
  const t=String(x).trim(); return t==="" || t==="-" || t==="–" || /^[-+]?0+([.,]0+)?$/.test(t);
}
function isJunkRow(r){
  if(isBlankOrZero(r.Model)) return true;
  return Object.keys(r).every(k=>/^(no\.?|stt|__.*)$/i.test(k.trim()) || isBlankOrZero(r[k]));
}
function cleanRows(rows){ return rows.filter(r=>!isJunkRow(r)); }
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:"array"});
  const name = wb.SheetNames.find(n=>norm(n)===norm(CONFIG.sheetName)) || wb.SheetNames.find(n=>norm(n).includes("datasheet"));
  if(!name) throw new Error(`Không thấy sheet "${CONFIG.sheetName}". Các sheet có: ${wb.SheetNames.join(", ")}`);
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:"",raw:true});
  const data = rows.map(r=>{ const o={}; for(const k in r){ let x=r[k]; if(typeof x==="string"){x=x.trim(); if(x.startsWith("#")) x="";} o[String(k).trim()]=x; } return o; })
                   .filter(r=>!isJunkRow(r));
  if(!data.length) throw new Error(`Sheet "${name}" không có dòng nào có cột Model`);
  return data;
}
async function loadFromSource(){
  const src = new URLSearchParams(location.search).get("src") || CONFIG.excelUrl;
  if(!src){ useCache(); return; }
  status("Đang đọc file Excel nguồn…");
  try{
    let res;
    if(isSharePoint(src)){
      if(!pca){ useCache(); status(`Chưa kết nối được Microsoft 365${graphError?": "+graphError:""}`, "warn"); return; }
      if(!account){ useCache(); status("Bấm “🔑 Đăng nhập Microsoft 365” để tải dữ liệu", "warn"); return; }
      res = await graphDownload(src);
    } else {
      res = await fetch(src + (src.includes("?")?"&":"?") + "_t=" + Date.now(), {credentials:"include"});
      if(!res.ok) throw new Error("HTTP "+res.status);
    }
    setData(parseWorkbook(new Uint8Array(await res.arrayBuffer())), "Excel nguồn · cập nhật " + stamp(), true);
    status(`${DATA.length} dòng · ${DATA_SOURCE}`, "ok");
  }catch(e){
    console.error(e); useCache();
    status(`Không đọc được Excel nguồn (${e.message})${DATA.length?" · đang hiển thị dữ liệu đã tải lúc trước trong phiên này":""}`, "warn");
  }
}
function setData(data, source, cache){
  DATA=cleanRows(data); DATA_SOURCE=source; buildIndex();
  // Không lưu dữ liệu vào trình duyệt — dữ liệu chỉ nằm trong bộ nhớ khi trang đang mở
  if(current){ const same=DATA.find(d=>d.Model===current.Model && d.Type===current.Type); same ? render(same) : clearView(); }
  else if(DATA.length) clearView();
}
/* Không có dữ liệu mới → để trống (không dùng bản cũ) */
function useCache(){
  if(DATA.length && DATA!==EMBEDDED) return;     // giữ dữ liệu vừa tải trong phiên (vd. bấm Làm mới bị lỗi mạng)
  setData([], "chưa có dữ liệu", false);
  status("Chưa có dữ liệu");
  showEmpty();
}
function showEmpty(){
  if(DATA.length) return;
  $("#zoombar")?.classList.remove("show");
  current=null; q.value="";
  $("#stage").innerHTML = '<div class="placeholder">Chưa tải được dữ liệu từ file Excel nguồn.<br>Bấm <b>🔑 Đăng nhập Microsoft 365</b> (hoặc <b>🔄 Làm mới</b>) để tải dữ liệu mới nhất.</div>';
  $("#pdf").disabled=$("#prn").disabled=true;
}

/* ============ CHỈ MỤC TÌM KIẾM ============ */
let INDEX = [];
function buildIndex(){
  INDEX = DATA.map((d,i)=>({i, label:String(d.Model), sub:[d.Type, d.SKU].filter(Boolean).join(" · "),
     key: norm([d.Model,d.Type,d.SKU,field(d,"DIN code L"),field(d,"DIN code R")].join(" "))}))
     .sort((a,b)=>a.label.localeCompare(b.label, undefined, {numeric:true}));
  status(`${DATA.length} dòng · ${DATA_SOURCE}`);
  if(typeof fillAdvSelects==="function" && document.getElementById("advform")) fillAdvSelects();
  if(typeof advRows!=="undefined" && advRows.length) runAdvanced();
}
function search(q){
  const toks = String(q).trim().split(/\s+/).map(norm).filter(Boolean);
  if(!toks.length) return INDEX;
  const res = INDEX.filter(e=>toks.every(t=>e.key.includes(t)));
  const nm = norm(toks.join(""));
  return res.sort((a,b)=>(norm(b.label).startsWith(nm)) - (norm(a.label).startsWith(nm)));
}
function hl(text, q){
  const t=String(q).trim(); if(!t) return esc(text);
  const i=text.toLowerCase().indexOf(t.toLowerCase());
  return i<0 ? esc(text) : esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+t.length))+"</mark>"+esc(text.slice(i+t.length));
}

/* ============ COMBOBOX ============ */
const q=$("#q"), lst=$("#lst"); let items=[], act=-1, current=null;
function openList(all){
  items = all ? INDEX : search(q.value);
  const show = items.slice(0,300);
  lst.innerHTML = show.length ? show.map((e,k)=>`<li role="option" data-k="${k}"><div class="m">${hl(e.label, all?"":q.value)}</div><div class="t">${esc(e.sub)}</div></li>`).join("")
    + (items.length>300?`<li class="empty">… còn ${items.length-300} kết quả, gõ thêm để lọc</li>`:"")
    : `<li class="empty">Không tìm thấy “${esc(q.value)}”</li>`;
  act=-1; lst.classList.add("open"); q.setAttribute("aria-expanded","true");
}
function closeList(){ lst.classList.remove("open"); q.setAttribute("aria-expanded","false"); }
function pick(k){ const e=items[k]; if(!e) return; q.value=e.label; closeList(); render(DATA[e.i]); }
q.addEventListener("input",()=>openList(false));
q.addEventListener("focus",()=>openList(!q.value));
q.addEventListener("keydown",ev=>{
  const lis=[...lst.querySelectorAll("li[data-k]")];
  if(ev.key==="ArrowDown"){ev.preventDefault(); if(!lst.classList.contains("open")) openList(false); act=Math.min(act+1,lis.length-1);}
  else if(ev.key==="ArrowUp"){ev.preventDefault(); act=Math.max(act-1,0);}
  else if(ev.key==="Enter"){ev.preventDefault(); pick(act>=0?act:0); return;}
  else if(ev.key==="Escape"){closeList(); return;} else return;
  lis.forEach((li,i)=>li.classList.toggle("active",i===act)); lis[act]?.scrollIntoView({block:"nearest"});
});
lst.addEventListener("mousedown",ev=>{const li=ev.target.closest("li[data-k]"); if(li){ev.preventDefault(); pick(+li.dataset.k);}});
$("#chev").addEventListener("click",()=>{ lst.classList.contains("open")?closeList():(q.focus(),openList(true)); });
document.addEventListener("click",ev=>{ if(!$("#combo").contains(ev.target)) closeList(); });

/* Có in phần Đặc tính tự phóng cho sản phẩm này không (theo cột Group) */
/* Nhãn + đơn vị dòng dung lượng theo Group */
function capacityRule(d){
  const g=String(field(d,"Group")??"").trim().toUpperCase(), m=CONFIG.capacityByGroup;
  const k=Object.keys(m).find(k=>k!=="default" && k.trim().toUpperCase()===g);
  return m[k] || m.default;
}
const hasSelfDischarge = d => CONFIG.selfDischargeGroups.map(g=>String(g).trim().toUpperCase())
                                .includes(String(field(d,"Group")??"").trim().toUpperCase());

/* Cột của bảng theo đúng lưới trong Word (mm): 80 | 7+3 (khoảng trống) | 31.3+28.7 | 35 */
const COLS = `<colgroup><col style="width:80mm"><col style="width:10mm"><col style="width:60mm"><col style="width:35mm"></colgroup>`;

function pages(d, vi){
  const L = vi ? LABELS.vi : LABELS.en, F = n => field(d,n);
  const u=(x,unit)=> x===""||x==null ? "–" : `${esc(x)} ${unit}`;
  const row=(k,val)=>`<tr><td>${k}</td><td class="gap"></td><td class="v" colspan="2">${val}</td></tr>`;
  const dim=(k,sub,val)=>`<tr><td>${k}</td><td class="gap"></td><td class="s">${sub}</td><td class="v">${val}</td></tr>`;
  const sec=label=>`<tr class="sec"><td class="h">${label}</td><td></td><td colspan="2"></td></tr>`;
  const box=(info)=> info.url ? `<div class="imgbox" data-src="${esc(info.url)}" data-miss="${esc(L.miss)}"></div>`
      : `<div class="imgbox"><span class="ph">${L.noimg}<small class="diag">${esc(info.why)}</small></span></div>`;
  const nw=F("Net weight"), gw=F("Gross Weight");
  const withSD = hasSelfDischarge(d);
  const drawingUrl = imageInfo(CONFIG.images.drawing, d, "Drawing");

  const specTable = `<table class="spec">${COLS}
      ${sec(L.spec)}
      ${row(L.volt, u(F("Voltage"),"V"))}
      ${(()=>{ const c=capacityRule(d); return row(vi?c.vi:c.en, u(dec(F("Capacity"),vi),c.unit)); })()}
      ${row(L.cca, u(F("CCA"),"A"))}
      ${row(L.rc, u(F("RC"),L.min))}
      ${dim(L.dim,L.len,u(F("Length"),"mm"))}${dim("",L.wid,u(F("Width"),"mm"))}${dim("",L.hei,u(F("Height"),"mm"))}${dim("",L.th,u(F("Total Height"),"mm"))}
      ${row(L.nw, nw===""?"–":`${L.ap} ${num(nw,2,vi)} kg`)}
      ${row(L.gw, gw===""?"–":`${L.ap} ${num(gw,2,vi)} kg`)}
      ${row(L.term, esc(v(F("Terminal"))))}
      ${row(L.lay, esc(v(F("Cell Layout"))))}
      ${row(L.hd, esc(v(F("Hold down"))))}
      ${row(L.mat, esc(v(F("Material"))))}
      ${row(L.temp, esc(CONFIG.operatingTemp).replace(/([℃℉])/g,'<span class="sym">$1</span>'))}
      ${withSD ? sec(L.sd) + `<tr class="img"><td colspan="4">${box(imageInfo(CONFIG.images.selfDischarge, d, "Self Discharge"))}</td></tr>` : ""}
    </table>`;
  const drawing = `<table class="spec">${COLS}${sec(L.dr)}</table><div class="drawfill">${box(drawingUrl)}</div>`;
  const top = `${header(vi)}<div class="ttl">${L.t}</div><div class="mdl">${L.m} ${esc(d.Model)}</div>`;

  // Nhóm có Self-discharge: Drawing sang trang riêng (như file Word). Nhóm khác: gọn trong 1 trang.
  return withSD
    ? `<section class="page">${top}${specTable}</section><section class="page">${header(vi)}${drawing}</section>`
    : `<section class="page">${top}${specTable}${drawing}</section>`;
}

/* Tải ảnh: ảnh trên SharePoint/OneDrive đi qua Graph (để PDF nhúng được ảnh), ảnh khác tải trực tiếp */
const imgCache = new Map();
function fetchImage(url){
  if(imgCache.has(url)) return imgCache.get(url);
  const p = (async()=>{
    if(isSharePoint(url)){
      if(!pca) throw new Error("hình nằm trên SharePoint/OneDrive nhưng chưa kết nối được Microsoft 365");
      if(!account) throw new Error("hình nằm trên SharePoint/OneDrive — hãy bấm “Đăng nhập Microsoft 365”");
      return URL.createObjectURL(await (await graphDownload(url)).blob());
    }
    try{ const r=await fetch(url,{mode:"cors"}); if(r.ok) return URL.createObjectURL(await r.blob());
         if(r.status===404) throw new Error("không có file hình tại đường dẫn này (404) — kiểm tra tên file, chữ hoa/thường"); }
    catch(e){ if(/404/.test(e.message)) throw e; }
    return url;   // máy chủ không cho CORS: vẫn thử hiển thị trực tiếp
  })();
  imgCache.set(url,p); p.catch(()=>imgCache.delete(url)); return p;
}
function loadImages(){
  return Promise.all([...document.querySelectorAll(".imgbox[data-src]")].map(async box=>{
    let reason="";
    try{
      const src = await fetchImage(box.dataset.src);
      await new Promise((ok,fail)=>{ const im=new Image(); im.onload=()=>{box.innerHTML=""; box.appendChild(im); ok();};
        im.onerror=()=>fail(new Error("trình duyệt không mở được file hình (sai đường dẫn hoặc không phải file ảnh)")); im.src=src; });
    }catch(e){ reason=e.message||String(e);
      box.innerHTML=`<span class="miss">${esc(box.dataset.miss)}<small class="diag">${esc(reason)}</small></span>`; }
  }));
}
let imagesReady = Promise.resolve();
/* ============ PHÓNG TO / THU NHỎ ============ */
const ZMIN=0.3, ZMAX=2.5, ZSTEP=0.1;
let zoomFit = false, zoom = 1;
try{ const z=localStorage.getItem("ds_zoom");
  if(z==="fit") zoomFit=true; else if(z && !isNaN(+z)) zoom=+z;
  else if(innerWidth<860) zoomFit=true;                 // màn hình nhỏ: mặc định vừa khung
}catch{ if(innerWidth<860) zoomFit=true; }
function fitZoom(){
  const st=$("#stage"), pg=st.querySelector(".page"); if(!pg) return 1;
  const pageW = pg.offsetWidth;                   // chiều rộng thật của trang A4 (chưa phóng)
  return Math.max(ZMIN, Math.min(ZMAX, (st.clientWidth - 24) / pageW));
}
function applyZoom(){
  const st=$("#stage"); if(zoomFit) zoom = fitZoom();
  zoom = Math.round(Math.max(ZMIN, Math.min(ZMAX, zoom))*100)/100;
  st.style.setProperty("--z", zoom);
  $("#zval").textContent = Math.round(zoom*100) + "%";
  $("#zout").disabled = zoom<=ZMIN; $("#zin").disabled = zoom>=ZMAX;
  $("#zfit").classList.toggle("on", zoomFit);
  $("#zoombar").classList.toggle("show", !!st.querySelector(".page"));
  try{ localStorage.setItem("ds_zoom", zoomFit ? "fit" : String(zoom)); }catch{}
}
function setZoom(z){ zoomFit=false; zoom=z; applyZoom(); }
$("#zin").addEventListener("click",()=>setZoom(Math.round((zoom+ZSTEP)*10)/10));
$("#zout").addEventListener("click",()=>setZoom(Math.round((zoom-ZSTEP)*10)/10));
$("#zval").addEventListener("click",()=>setZoom(1));
$("#zfit").addEventListener("click",()=>{ zoomFit=!zoomFit; if(!zoomFit) zoom=1; applyZoom(); });
$("#stage").addEventListener("wheel",ev=>{                        // Ctrl + lăn chuột trên trang data sheet
  if(!ev.ctrlKey || !$("#stage .page")) return;
  ev.preventDefault(); setZoom(zoom + (ev.deltaY<0 ? ZSTEP : -ZSTEP));
},{passive:false});
addEventListener("resize",()=>{ if(zoomFit) applyZoom(); });

function render(d){
  current=d; const lg=$("#lang").value;
  $("#stage").innerHTML = (lg!=="vi"?pages(d,false):"") + (lg!=="en"?pages(d,true):"");
  applyZoom();
  $("#pdf").disabled=$("#prn").disabled=false;
  imagesReady = loadImages();
}
function clearView(){ $("#zoombar").classList.remove("show"); current=null; q.value=""; $("#stage").innerHTML='<div class="placeholder">Chọn một sản phẩm ở ô phía trên để xem thông số kỹ thuật.</div>'; $("#pdf").disabled=$("#prn").disabled=true; }
$("#lang").addEventListener("change",()=>{ if(current) render(current); if(advRows.length) renderAdvTable(); });

/* ============ XUẤT PDF / IN ============ */
const pdfName = () => "DATASHEET_" + String(current.Model).replace(/[^\w\-]+/g,"_");
function toast(msg, ms=7000){
  let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms);
}
/* In bằng trình duyệt → "Lưu dưới dạng PDF". Luôn giữ được hình (kể cả hình trên SharePoint/máy chủ khác).
   Tên file gợi ý lấy theo tiêu đề trang. */
async function printAsPdf(){
  await imagesReady;
  const old=document.title; document.title=pdfName();
  const restore=()=>{ document.title=old; removeEventListener("afterprint",restore); };
  addEventListener("afterprint",restore); window.print(); setTimeout(restore, 1000);
}
/* Đổi mọi hình về dạng dữ liệu nội bộ (data URL) để thư viện PDF chụp được.
   Trả về false nếu có hình mà máy chủ không cho phép (không có CORS). */
async function makeImagesCapturable(){
  let ok=true;
  for(const im of document.querySelectorAll("#stage .imgbox img")){
    if(/^(data:|blob:)/.test(im.src)) continue;
    try{
      const url = await new Promise((res,rej)=>{ const x=new Image(); x.crossOrigin="anonymous";
        x.onload=()=>{ try{ const c=document.createElement("canvas"); c.width=x.naturalWidth; c.height=x.naturalHeight;
          c.getContext("2d").drawImage(x,0,0); res(c.toDataURL("image/png")); }catch(e){ rej(e); } };
        x.onerror=rej; x.src=im.src; });
      im.src=url;
    }catch{ ok=false; }
  }
  return ok;
}
$("#prn").addEventListener("click", printAsPdf);
$("#pdf").addEventListener("click",async()=>{
  if(!current) return;
  const btn=$("#pdf"); btn.disabled=true; btn.textContent="Đang tạo PDF…";
  try{
    await imagesReady;
    const capturable = window.html2pdf && await makeImagesCapturable();
    if(!capturable){
      // Hình nằm ở máy chủ không cho phép chụp → dùng bộ in của trình duyệt để PDF vẫn có hình
      toast("Hộp thoại In sẽ mở: chọn máy in “Save as PDF / Lưu dưới dạng PDF” rồi bấm Lưu. (Cách này giữ đầy đủ hình ảnh.)");
      await printAsPdf();
    } else {
      const stage=$("#stage"), pages=[...stage.querySelectorAll(".page")];
      const h2c={scale:2,useCORS:true,scrollX:0,scrollY:0};
      stage.classList.add("pdfmode"); document.body.classList.add("pdfexport");
      try{
        // chụp từng trang thành ảnh rồi đặt vừa khổ A4 → không lệch, không có trang trắng
        const doc = await html2pdf().set({jsPDF:{unit:"mm",format:"a4",orientation:"portrait"}, margin:0}).from("<div></div>").toPdf().get("pdf");
        for(let i=0;i<pages.length;i++){
          const cv = await html2pdf().set({html2canvas:h2c}).from(pages[i]).toCanvas().get("canvas");
          let w=210, h=w*cv.height/cv.width; if(h>297){ h=297; w=h*cv.width/cv.height; }
          if(i) doc.addPage(); else doc.setPage(1);
          doc.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",(210-w)/2,0,w,h);
          // giữ link bấm được (email, website) trong PDF
          const pr=pages[i].getBoundingClientRect(), k=w/pr.width, x0=(210-w)/2;
          pages[i].querySelectorAll("a[href]").forEach(a=>{ const r=a.getBoundingClientRect();
            doc.link(x0+(r.left-pr.left)*k, (r.top-pr.top)*k, r.width*k, r.height*k, {url:a.href}); });
        }
        doc.save(pdfName()+".pdf");
      } finally { stage.classList.remove("pdfmode"); document.body.classList.remove("pdfexport"); }
    }
  }catch(e){ console.error(e); toast("Không tạo được PDF trực tiếp — chọn “Save as PDF” trong hộp thoại In."); await printAsPdf(); }
  btn.disabled=false; btn.textContent="⬇ Xuất PDF";
});


/* ============ TÌM KIẾM NÂNG CAO (theo thông số) ============ */
const ADV_FIELDS = [
  {k:"Length",       label:"Dài",      kind:"dim"},
  {k:"Width",        label:"Rộng",     kind:"dim"},
  {k:"Total Height", label:"Tổng cao", kind:"dim"},
  {k:"Capacity",     label:"Ah",       kind:"min"},
  {k:"CCA",          label:"CCA",      kind:"min"}
];
const toNum = x => { if(x===""||x==null) return NaN; const n=parseFloat(String(x).replace(",", ".")); return n; };
const advForm=$("#advform"), advRes=$("#advres");
$("#advbtn").addEventListener("click",()=>{
  const open=$("#adv").classList.toggle("open");
  $("#advbtn").classList.toggle("on",open); $("#advbtn").setAttribute("aria-expanded",open);
  if(open) advForm.querySelector("input").focus();
});
function fillAdvSelects(){
  const put=(name,col)=>{ const sel=advForm.elements[name], cur=sel.value;
    const vals=[...new Set(DATA.map(d=>String(field(d,col)??"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
    sel.innerHTML='<option value="">Tất cả</option>'+vals.map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join(""); };
  put("group","Group"); put("layout","Cell Layout");
}
/* Đánh giá 1 sản phẩm theo điều kiện: trả về {pass, score, flags} */
function evaluate(d, c){
  let pass=true, score=0; const flags={};
  for(const f of ADV_FIELDS){
    const want=c[f.k]; if(isNaN(want)) continue;
    const got=toNum(field(d,f.k));
    if(isNaN(got)){ pass=false; flags[f.k]=false; score+=10; continue; }
    let ok, dev;
    if(f.kind==="dim"){
      if(c.dimmode==="fit"){ ok = got<=want; dev = ok ? (want-got)/want : (got-want)/want*5; }
      else { dev=Math.abs(got-want); ok = dev<=c.tol; dev = dev/want*(ok?1:5); }
    } else {
      const hi = c.caphi ? want*(1+c.hipct/100) : Infinity;
      ok = got>=want && got<=hi; dev = got>=want ? (got-want)/want*0.5 : (want-got)/want*5;
      if(got>hi) dev += (got-hi)/want*2;
    }
    flags[f.k]=ok; if(!ok) pass=false; score+=dev;
  }
  if(c.group && String(field(d,"Group")).trim()!==c.group) pass=false;
  if(c.layout && String(field(d,"Cell Layout")).trim()!==c.layout) pass=false;
  return {pass, score, flags};
}
function readCriteria(){
  const E=advForm.elements, c={};
  for(const f of ADV_FIELDS) c[f.k]=toNum(E[f.k].value);
  c.dimmode=E.dimmode.value; c.tol=Math.max(0,toNum(E.tol.value)||0);
  c.caphi=E.caphi.checked; c.hipct=Math.max(0,toNum(E.hipct.value)||0);
  c.group=E.group.value; c.layout=E.layout.value;
  return c;
}
let advRows=[], advExact=true;
const byModel=(a,b)=>String(a.d.Model).localeCompare(String(b.d.Model),"vi",{numeric:true,sensitivity:"base"})
                  || String(a.d.Type).localeCompare(String(b.d.Type),"vi",{numeric:true,sensitivity:"base"});
function runAdvanced(){
  const c=readCriteria();
  if(!DATA.length){ advRes.innerHTML=`<p class="sum warn">${(resVi()?RES_TXT.vi:RES_TXT.en).nodata}</p>`; advRows=[]; return; }
  const all = DATA.map(d=>({d, ...evaluate(d,c)}));
  let rows = all.filter(r=>r.pass), exact=true;
  if(!rows.length){
    exact=false;     // không có kết quả đạt đủ điều kiện → lấy 15 chủng loại gần nhất
    rows = all.filter(r=>(!c.group||String(field(r.d,"Group")).trim()===c.group) && (!c.layout||String(field(r.d,"Cell Layout")).trim()===c.layout))
              .sort((a,b)=>a.score-b.score).slice(0,15);
  }
  advRows=rows; advExact=exact;
  renderAdvTable();
}

/* Cột của bảng kết quả: k = tên cột trong Excel, num = sắp xếp theo số */

  {k:"Group",        h:{vi:"Nhóm",             en:"Group"}},

  {k:"Width",        h:{vi:"Rộng",             en:"Width"},        num:1},
  {k:"Height",       h:{vi:"Cao",              en:"Height"},       num:1},
  {k:"Total Height", h:{vi:"Tổng cao",         en:"Total Height"}, num:1},
  {k:"Capacity",     h:{vi:"Dung lượng",       en:"Capacity"},     num:1, unit:r=>capacityRule(r.d).unit},
  {k:"CCA",          h:{vi:"CCA",              en:"CCA"},          num:1, unit:()=>"A"},
  {k:"RC",           h:{vi:"RC",               en:"RC"},           num:1, unit:vi=>vi?"phút":"min"},
  {k:"Net weight",   h:{vi:"Trọng lượng tịnh", en:"Net weight"},   num:1, unit:()=>"kg", dec:2},
  {k:"Gross Weight", h:{vi:"Trọng lượng tổng", en:"Gross weight"}, num:1, unit:()=>"kg", dec:2},
  {k:"Cell Layout",  h:{vi:"Bố trí",           en:"Layout"},       num:1},
  {k:"Terminal",     h:{vi:"Cọc",              en:"Terminal"}},
  {k:"Hold down",    h:{vi:"Chân đế",          en:"Hold down"}}

const RES_TXT = {
  vi:{ found:n=>`Tìm thấy <b>${n}</b> chủng loại. Bấm tiêu đề cột để sắp xếp, bấm một dòng để xem data sheet.`,
       near:n=>`Không có chủng loại đáp ứng đủ mọi điều kiện. Dưới đây là ${n} chủng loại gần nhất — ô màu cam là thông số chưa đạt.`,
       xlsx:n=>`⬇ Xuất Excel (${n} dòng)`, sortBy:"Sắp xếp theo", nodata:"Chưa có dữ liệu — hãy đăng nhập Microsoft 365 để tải file Excel." },
  en:{ found:n=>`Found <b>${n}</b> product${n===1?"":"s"}. Click a column header to sort, click a row to view its data sheet.`,
       near:n=>`No product meets every criterion. Showing the ${n} closest matches — orange cells do not meet the criteria.`,
       xlsx:n=>`⬇ Export Excel (${n} row${n===1?"":"s"})`, sortBy:"Sort by", nodata:"No data yet — sign in to Microsoft 365 to load the Excel file." }
};
/* Ngôn ngữ của phần kết quả: chỉ chọn Tiếng Việt mới hiện tiếng Việt; EN hoặc EN + VI → tiếng Anh */
const resVi = () => $("#lang").value === "vi";
let advSort = {k:"Model", dir:1};
function sortAdvRows(){
  const c = RES_COLS.find(x=>x.k===advSort.k) || RES_COLS[0], dir = advSort.dir;
  const val = r => { const x=field(r.d,c.k); return x===""||x==null ? null : c.num ? toNum(x) : String(x); };
  advRows.sort((a,b)=>{
    let va=val(a), vb=val(b);
    if(c.num){ if(isNaN(va)) va=null; if(isNaN(vb)) vb=null; }
    if(va===null && vb===null) return byModel(a,b);
    if(va===null) return 1; if(vb===null) return -1;               // ô trống luôn nằm cuối
    const r = c.num ? va-vb : va.localeCompare(vb,"vi",{numeric:true,sensitivity:"base"});
    return r ? r*dir : byModel(a,b);
  });
}
function renderAdvTable(){
  sortAdvRows();
  const vi=resVi(), T=vi?RES_TXT.vi:RES_TXT.en, n=advRows.length, exact=advExact;
  const fmt=(x,c)=>{ const n=toNum(x); if(isNaN(n)) return String(x);
    return c.dec!=null ? (vi ? n.toFixed(c.dec).replace(".", ",") : n.toFixed(c.dec)) : dec(x, vi); };
  const cell=(r,c)=>{ const raw=field(r.d,c.k);
    if(c.k==="Model") return `<td><b>${esc(r.d.Model)}</b><div class="t">${esc(r.d.Type)}</div></td>`;
    if(raw===""||raw==null) return `<td${c.num?' class="n"':""}>–</td>`;
    const cls = r.flags[c.k]===true ? "ok" : r.flags[c.k]===false ? "off" : "";
    const val = c.num ? fmt(raw,c) : raw;
    const u = c.unit ? " "+(c.k==="Capacity" ? c.unit(r) : c.unit(vi)) : "";
    return `<td class="${c.num?"n ":""}${cls}">${esc(val)}${esc(u)}</td>`; };
  const head = c => vi ? c.h.vi : c.h.en;
  const arrow = c => c.k===advSort.k ? (advSort.dir>0 ? " ▲" : " ▼") : "";
  advRes.innerHTML = `<div class="bar"><p class="sum ${exact?"":"warn"}">${exact ? T.found(n) : T.near(n)}</p>
      <button type="button" class="btn" id="advxlsx">${T.xlsx(n)}</button></div>
    <div class="scroll"><table><thead><tr>
      ${RES_COLS.map(c=>`<th class="sort${c.num?" n":""}${c.k===advSort.k?" on":""}" data-k="${esc(c.k)}" title="${T.sortBy} ${esc(head(c))}"
         aria-sort="${c.k===advSort.k?(advSort.dir>0?"ascending":"descending"):"none"}">${esc(head(c))}${arrow(c)}</th>`).join("")}
    </tr></thead><tbody>
      ${advRows.map((r,i)=>`<tr data-i="${i}"${current===r.d?' class="sel"':""}>${RES_COLS.map(c=>cell(r,c)).join("")}</tr>`).join("")}
    </tbody></table></div>`;
}
advRes.addEventListener("click",ev=>{
  const th=ev.target.closest("th.sort"); if(!th) return;
  ev.stopPropagation();
  const k=th.dataset.k; advSort = advSort.k===k ? {k, dir:-advSort.dir} : {k, dir:1};
  const sc=advRes.querySelector(".scroll")?.scrollLeft||0;
  renderAdvTable(); const el=advRes.querySelector(".scroll"); if(el) el.scrollLeft=sc;
}, true);

/* Xuất kết quả tìm kiếm ra file Excel (.xlsx) */
const EXPORT_COLS = [   // [cột Excel nguồn, tiêu đề tiếng Việt, tiêu đề tiếng Anh]
  ["Model","Model","Model"], ["Type","Chủng loại","Type"], ["SKU","SKU","SKU"], ["Group","Nhóm","Group"],
  ["Voltage","Điện thế (V)","Voltage (V)"], ["Capacity","Dung lượng","Capacity"], ["__unit","Đơn vị","Unit"],
  ["CCA","CCA (A)","CCA (A)"], ["RC","RC (phút)","RC (min)"],
  ["Length","Dài (mm)","Length (mm)"], ["Width","Rộng (mm)","Width (mm)"], ["Height","Cao (mm)","Container Height (mm)"],
  ["Total Height","Tổng cao (mm)","Total Height (mm)"],
  ["Net weight","Trọng lượng tịnh (kg)","Net weight (kg)"], ["Gross Weight","Trọng lượng tổng (kg)","Gross weight (kg)"],
  ["Terminal","Loại cọc","Terminal"], ["Cell Layout","Bố trí cực tính","Cell layout"], ["Hold down","Chân đế","Hold down"],
  ["Container Type","Container Type","Container Type"], ["Material","Vật liệu vỏ","Container Material"]
];
function exportAdvanced(){
  if(!advRows.length || !window.XLSX) return;
  const toCell = x => { if(x===""||x==null) return ""; const t=String(x).trim();
    return /^[-+]?\d+([.,]\d+)?$/.test(t) ? +t.replace(",",".") : t; };     // số giữ dạng số để lọc/tính trong Excel
  const hi = resVi() ? 1 : 2;
  const aoa = [EXPORT_COLS.map(c=>c[hi])].concat(advRows.map(r=>EXPORT_COLS.map(([k])=>
      k==="__unit" ? capacityRule(r.d).unit : toCell(field(r.d,k)))));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  ws["!cols"] = EXPORT_COLS.map((c,i)=>({wch: Math.min(48, Math.max(c[hi].length, ...aoa.slice(1).map(row=>String(row[i]??"").length)) + 2)}));
  ws["!autofilter"] = {ref: XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:aoa.length-1, c:EXPORT_COLS.length-1}})};
  ws["!freeze"] = {xSplit:1, ySplit:1};
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, hi===1 ? "Ket qua tim kiem" : "Search results");
  const t=new Date(), p=n=>String(n).padStart(2,"0");
  XLSX.writeFile(wb, `${hi===1?"TimKiem":"Search"}_DataSheet_${t.getFullYear()}${p(t.getMonth()+1)}${p(t.getDate())}_${p(t.getHours())}${p(t.getMinutes())}.xlsx`);
}
advRes.addEventListener("click",ev=>{ if(ev.target.closest("#advxlsx")){ ev.stopPropagation(); exportAdvanced(); } }, true);
advForm.addEventListener("submit",ev=>{ ev.preventDefault(); runAdvanced(); });
advForm.addEventListener("reset",()=>setTimeout(()=>{ advRes.innerHTML=""; advRows=[]; },0));
advRes.addEventListener("click",ev=>{
  const tr=ev.target.closest("tr[data-i]"); if(!tr) return;
  const r=advRows[+tr.dataset.i]; q.value=r.d.Model; render(r.d);
  advRes.querySelectorAll("tr.sel").forEach(x=>x.classList.remove("sel")); tr.classList.add("sel");
  $("#stage").scrollIntoView({behavior:"smooth", block:"start"});
});

/* ============ NÚT ĐIỀU KHIỂN ============ */
$("#refresh").addEventListener("click",()=>{ imgCache.clear(); loadFromSource(); });
$("#signin").addEventListener("click",async()=>{
  try{ const r=await pca.loginPopup({scopes:SCOPES}); account=r.account; $("#signin").hidden=true; loadFromSource(); }
  catch(e){ status("Đăng nhập không thành công: "+(e.errorCode==="popup_window_error"?"trình duyệt đã chặn cửa sổ đăng nhập, hãy cho phép pop-up cho trang này":e.message),"warn"); }
});
$("#load").addEventListener("click",()=>$("#file").click());
$("#file").addEventListener("change",async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ setData(parseWorkbook(new Uint8Array(await f.arrayBuffer())), f.name + " · nạp lúc " + stamp(), true); status(`${DATA.length} dòng · ${DATA_SOURCE}`,"ok"); }
  catch(e){ alert("Không đọc được file: "+e.message); }
  ev.target.value="";
});

/* ============ KHỞI ĐỘNG: tự đọc Excel mỗi lần mở trang ============ */
(async()=>{
  try{ localStorage.removeItem("ds_cache"); }catch{}      // xoá dữ liệu đã lưu từ các phiên bản trước
  buildIndex();
  try{ await graphInit(); }catch(e){ console.error(e); graphError=e.message; }
  await loadFromSource();
})();
</script>
